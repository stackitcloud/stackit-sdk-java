name: CI/CD

permissions: {}

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [17, 21, 25]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '${{ matrix.version }}'
          cache: 'gradle'

      - name: Check code format
        run: ./gradlew spotlessCheck
      
      - name: Lint
        run: make lint
      
      - name: Test
        run: make test

      - name: Build
        run: make build
      
      - name: Publish to local maven repo
        run: make install

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0

  cd:
    name: CD
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' }}
    needs: [ci]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # we need to fetch all existing git tags
          fetch-depth: 0
          persist-credentials: false

      - name: Create git tags and publish to Maven Central
        env:
          GPG_SIGNING_KEY: "${{ secrets.GPG_SIGNING_KEY }}"
          GPG_SIGNING_PASSWORD: "${{ secrets.GPG_SIGNING_PASSWORD }}"
          ORG_GRADLE_PROJECT_mavenCentralUsername: "${{ secrets.MAVEN_CENTRAL_USERNAME }}"
          ORG_GRADLE_PROJECT_mavenCentralPassword: "${{ secrets.MAVEN_CENTRAL_PASSWORD }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "SDK Releaser Bot"
          git config --global user.email "noreply@stackit.de"
          ./scripts/publish.sh

